[package]
name = "atme-app"
version = "0.1.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
rand = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.dev]
incremental = true
